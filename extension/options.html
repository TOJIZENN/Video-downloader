<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #333; padding: 16px; min-width: 340px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input { font: inherit; font-weight: 400; padding: 8px; border: 1px solid #cfd4ca; border-radius: 4px; }
    button { margin-top: 12px; border: 0; background: #4f46e5; color: #fff; font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    #status { color: #4f46e5; margin-left: 10px; }
  </style>
</head>
<body>
  <label>Downloader site address
    <input id="site" type="url" placeholder="http://localhost:3000">
  </label>
  <button id="save">Save</button><span id="status"></span>
  <script src="config.js"></script>
  <script src="options.js"></script>
</body>
</html>
