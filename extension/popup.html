<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 290px; margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #333; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #e2e5de; font-weight: 700; font-size: 16px; }
    main { padding: 14px; display: grid; gap: 10px; }
    .url { font-size: 12px; color: #777; word-break: break-all; max-height: 48px; overflow: hidden; }
    button { border: 0; background: #4f46e5; color: #fff; font: inherit; font-weight: 600; padding: 10px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #4338ca; }
    button:disabled { background: #a5a1f0; cursor: default; }
    footer { display: flex; justify-content: space-between; padding: 0 14px 12px; font-size: 13px; }
    a { color: #1f6fd1; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <header><img src="icons/icon32.png" width="22" height="22" alt=""><span id="brand">Helper</span></header>
  <main>
    <div class="url" id="url"></div>
    <button id="go" disabled>Download this video</button>
  </main>
  <footer><a id="open">Open site</a><a id="settings">Settings</a></footer>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
